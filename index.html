<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>業務報酬計算機</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #eef6ff;
            --text-color: #333;
            --border-radius: 12px;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f7f9; 
            color: var(--text-color);
            margin: 0; padding: 10px; 
            display: flex; justify-content: center;
        }

        .container { 
            width: 100%; max-width: 480px; 
            background: white; border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            overflow: hidden; margin-top: 10px;
        }

        .header { background: var(--primary-color); color: white; padding: 25px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; }
        .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.8; }

        .form-content { padding: 20px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: var(--primary-color); font-weight: 600; font-size: 14px; }

        select, input { 
            width: 100%; padding: 14px; 
            border: 1.5px solid #e0e7ee; border-radius: var(--border-radius); 
            font-size: 16px; outline: none; box-sizing: border-box;
            background-color: #fff;
        }

        .result-card { 
            background: var(--secondary-color); padding: 20px; 
            border-radius: var(--border-radius); margin-top: 25px; 
            border: 1px solid #d0e3ff;
        }

        .result-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
        .total-row { 
            border-top: 2px dashed #00336644; padding-top: 15px; 
            margin-top: 10px; font-weight: bold; font-size: 22px; 
            color: var(--primary-color); display: flex; justify-content: space-between;
        }

        .btn-reset { 
            background: #fff; color: #888; border: 1px solid #ddd; 
            width: 100%; padding: 12px; border-radius: var(--border-radius); 
            margin-top: 20px; font-weight: bold; cursor: pointer;
        }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">讀取雲端資料中...</div>

<div class="container">
    <div class="header">
        <h1>業務報酬計算機</h1>
        <p>資料來源：Google 試算表</p>
    </div>

    <div class="form-content">
        <div class="input-group">
            <label>1. 選擇商品名稱</label>
            <select id="productSelect" onchange="updateTypes()">
                <option value="">連線中...</option>
            </select>
        </div>

        <div class="input-group">
            <label>2. 選擇類型</label>
            <select id="typeSelect" onchange="updateTerms()">
                <option value="">請先選擇商品</option>
            </select>
        </div>

        <div class="input-group">
            <label>3. 選擇年期</label>
            <select id="termSelect" onchange="calculate()">
                <option value="">請先選擇類型</option>
            </select>
        </div>

        <div class="input-group">
            <label>4. 被保人年齡</label>
            <input type="number" id="ageInput" placeholder="請輸入年齡" oninput="calculate()">
        </div>

        <div class="input-group">
            <label>5. 輸入保費 (實收)</label>
            <input type="number" id="premiumInput" placeholder="請輸入金額" oninput="calculate()">
        </div>

        <div class="result-card">
            <div class="result-row"><span>FYC 比例</span><span id="fycRate">--</span></div>
            <div class="result-row"><span>行銷獎金比例</span><span id="bonusRate">--</span></div>
            <div class="result-row"><span>預估 FYC 報酬</span><span id="fycAmount">$0</span></div>
            <div class="result-row"><span>預估 行銷獎金</span><span id="bonusAmount">$0</span></div>
            <div class="total-row"><span>總計</span><span id="totalAmount">$0</span></div>
        </div>

        <button class="btn-reset" onclick="location.reload()">重新輸入</button>
    </div>
</div>

<script>
// 使用您提供的新 CSV 連結
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQYzNUsDsKADU8wout-3FhHvknuAWg4AHuWaewLwTKOQj2TcRDSC2chhNEI8nCUQQ_U_MJmszqwY3xH/pub?gid=313101956&single=true&output=csv';

let database = [];

async function loadData() {
    try {
        const response = await fetch(csvUrl);
        const text = await response.text();
        // 解析 CSV (支援換行與基本過濾)
        const rows = text.split(/\r?\n/).slice(1); 
        
        database = rows.map(row => {
            const cols = row.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            if (cols.length < 6) return null;
            return {
                name: cols[0],
                type: cols[1],
                term: cols[2],
                ageMin: parseInt(cols[3]) || 0,
                ageMax: parseInt(cols[4]) || 99,
                fycRate: parseFloat(cols[5]) || 0,
                bonusRate: (cols[6] === "無" || !cols[6]) ? 0 : parseFloat(cols[6])
            };
        }).filter(item => item && item.name);

        const products = [...new Set(database.map(i => i.name))];
        const select = document.getElementById('productSelect');
        select.innerHTML = '<option value="">請選擇商品</option>';
        products.forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`);
        
        document.getElementById('loading').style.display = 'none';
    } catch (e) {
        alert("資料讀取失敗，請確認試算表已發佈為 CSV 格式");
    }
}

function updateTypes() {
    const pName = document.getElementById('productSelect').value;
    const types = [...new Set(database.filter(i => i.name === pName).map(i => i.type))];
    const select = document.getElementById('typeSelect');
    select.innerHTML = '<option value="">請選擇類型</option>';
    types.forEach(t => select.innerHTML += `<option value="${t}">${t}</option>`);
    calculate();
}

function updateTerms() {
    const pName = document.getElementById('productSelect').value;
    const pType = document.getElementById('typeSelect').value;
    const terms = [...new Set(database.filter(i => i.name === pName && i.type === pType).map(i => i.term))];
    const select = document.getElementById('termSelect');
    select.innerHTML = '<option value="">請選擇年期</option>';
    terms.forEach(t => select.innerHTML += `<option value="${t}">${t}年</option>`);
    calculate();
}

function calculate() {
    const name = document.getElementById('productSelect').value;
    const type = document.getElementById('typeSelect').value;
    const term = document.getElementById('termSelect').value;
    const age = parseInt(document.getElementById('ageInput').value);
    const premium = parseFloat(document.getElementById('premiumInput').value) || 0;

    const match = database.find(i => i.name === name && i.type === type && i.term === term && age >= i.ageMin && age <= i.ageMax);

    if (match) {
        const fyc = Math.round(premium * match.fycRate);
        const bonus = Math.round(premium * match.bonusRate);
        document.getElementById('fycRate').innerText = (match.fycRate * 100).toFixed(1) + '%';
        document.getElementById('bonusRate').innerText = match.bonusRate > 0 ? (match.bonusRate * 100).toFixed(1) + '%' : '無';
        document.getElementById('fycAmount').innerText = '$' + fyc.toLocaleString();
        document.getElementById('bonusAmount').innerText = '$' + bonus.toLocaleString();
        document.getElementById('totalAmount').innerText = '$' + (fyc + bonus).toLocaleString();
    } else {
        document.getElementById('fycAmount').innerText = '$0';
        document.getElementById('totalAmount').innerText = (name && age) ? '不符年齡區間' : '$0';
    }
}

loadData();
</script>

</body>
</html>
