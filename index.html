<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>業務報酬計算機 - 專業版</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #eef6ff;
            --accent-color: #f39c12;
            --text-color: #333;
            --border-radius: 12px;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f7f9; 
            color: var(--text-color);
            margin: 0; 
            padding: 10px; 
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 480px; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            overflow: hidden;
            margin-top: 10px;
        }

        .header { 
            background: var(--primary-color); 
            color: white; 
            padding: 25px 20px; 
            text-align: center; 
        }

        .header h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
        .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.8; }

        .form-content { padding: 20px; }

        .input-group { margin-bottom: 18px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--primary-color); 
            font-weight: 600; 
            font-size: 14px; 
        }

        select, input { 
            width: 100%; 
            padding: 14px; 
            border: 1.5px solid #e0e7ee; 
            border-radius: var(--border-radius); 
            font-size: 16px; 
            outline: none; 
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        select:focus, input:focus { 
            border-color: var(--primary-color); 
            box-shadow: 0 0 0 3px rgba(0,51,102,0.1);
        }

        .result-card { 
            background: var(--secondary-color); 
            padding: 20px; 
            border-radius: var(--border-radius); 
            margin-top: 25px; 
            border: 1px solid #d0e3ff;
        }

        .result-row { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 10px; 
            font-size: 15px; 
        }

        .result-row span:last-child { font-weight: 600; color: #2c3e50; }

        .total-row { 
            border-top: 2px dashed #00336644; 
            padding-top: 15px; 
            margin-top: 10px; 
            font-weight: bold; 
            font-size: 22px; 
            color: var(--primary-color); 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-reset { 
            background: #fff; 
            color: #888; 
            border: 1px solid #ddd; 
            width: 100%; 
            padding: 12px; 
            border-radius: var(--border-radius); 
            margin-top: 20px; 
            font-weight: bold; 
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-reset:hover { background: #f8f8f8; color: #444; }

        .footer-note { 
            font-size: 11px; 
            color: #999; 
            text-align: center; 
            margin-top: 20px; 
            padding: 0 10px;
            line-height: 1.5;
        }

        /* 載入中動畫 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">載入最新商品資料中...</div>

<div class="container">
    <div class="header">
        <h1>業務報酬計算機</h1>
        <p>即時串接試算表數據</p>
    </div>

    <div class="form-content">
        <div class="input-group">
            <label>1. 選擇商品名稱</label>
            <select id="productSelect" onchange="updateTypes()">
                <option value="">請先稍候...</option>
            </select>
        </div>

        <div class="input-group">
            <label>2. 選擇類型</label>
            <select id="typeSelect" onchange="updateTerms()">
                <option value="">請選擇商品</option>
            </select>
        </div>

        <div class="input-group">
            <label>3. 選擇年期</label>
            <select id="termSelect" onchange="calculate()">
                <option value="">請選擇類型</option>
            </select>
        </div>

        <div class="input-group">
            <label>4. 被保人投保年齡</label>
            <input type="number" id="ageInput" placeholder="請輸入年齡" oninput="calculate()">
        </div>

        <div class="input-group">
            <label>5. 輸入首期保費 (實收)</label>
            <input type="number" id="premiumInput" placeholder="請輸入保費金額" oninput="calculate()">
        </div>

        <div class="result-card">
            <div class="result-row"><span>FYC 比例</span><span id="fycRate">--</span></div>
            <div class="result-row"><span>行銷獎金比例</span><span id="bonusRate">--</span></div>
            <div class="result-row"><span>預估 FYC 報酬</span><span id="fycAmount">$0</span></div>
            <div class="result-row"><span>預估 行銷獎金</span><span id="bonusAmount">$0</span></div>
            <div class="total-row">
                <span>總計</span>
                <span id="totalAmount">$0</span>
            </div>
        </div>

        <button class="btn-reset" onclick="window.location.reload()">重新輸入</button>
        
        <div class="footer-note">
            ※ 本計算結果僅供參考，不代表實際發放金額。<br>
            正式報酬以公司業務報酬清單與系統結算為準。
        </div>
    </div>
</div>

<script>
// 您的 Google 試算表 CSV 導出網址
const csvUrl = 'https://docs.google.com/spreadsheets/d/1yMOFsO8XtunEgu2cU8XF6HT71pKVbYdUus5E9zROfgw/export?format=csv&gid=0';

let database = [];

async function init() {
    try {
        const response = await fetch(csvUrl);
        const data = await response.text();
        const rows = data.split('\n').slice(1); // 跳過標題列
        
        database = rows.map(row => {
            const cols = row.split(',').map(c => c.trim());
            return {
                name: cols[0],
                type: cols[1],
                term: cols[2],
                ageMin: parseInt(cols[3]) || 0,
                ageMax: parseInt(cols[4]) || 99,
                fycRate: parseFloat(cols[5]) || 0,
                bonusRate: (cols[6] === "無" || !cols[6]) ? 0 : parseFloat(cols[6])
            };
        }).filter(item => item.name); // 過濾掉空白列

        populateProducts();
        document.getElementById('loading').style.display = 'none';
    } catch (error) {
        console.error("資料載入錯誤:", error);
        alert("資料載入失敗，請檢查網路或試算表共用設定。");
    }
}

function populateProducts() {
    const products = [...new Set(database.map(item => item.name))];
    const select = document.getElementById('productSelect');
    select.innerHTML = '<option value="">請選擇商品</option>';
    products.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        select.appendChild(opt);
    });
}

function updateTypes() {
    const pName = document.getElementById('productSelect').value;
    const types = [...new Set(database.filter(i => i.name === pName).map(i => i.type))];
    const select = document.getElementById('typeSelect');
    select.innerHTML = '<option value="">請選擇類型</option>';
    types.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
    });
    calculate();
}

function updateTerms() {
    const pName = document.getElementById('productSelect').value;
    const pType = document.getElementById('typeSelect').value;
    const terms = [...new Set(database.filter(i => i.name === pName && i.type === pType).map(i => i.term))];
    const select = document.getElementById('termSelect');
    select.innerHTML = '<option value="">請選擇年期</option>';
    terms.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t + '年';
        select.appendChild(opt);
    });
    calculate();
}

function calculate() {
    const name = document.getElementById('productSelect').value;
    const type = document.getElementById('typeSelect').value;
    const term = document.getElementById('termSelect').value;
    const age = parseInt(document.getElementById('ageInput').value);
    const premium = parseFloat(document.getElementById('premiumInput').value) || 0;

    if (!name || !type || !term || isNaN(age)) {
        resetResults();
        return;
    }

    const match = database.find(i => 
        i.name === name && 
        i.type === type && 
        i.term === term && 
        age >= i.ageMin && 
        age <= i.ageMax
    );

    if (match) {
        const fyc = Math.round(premium * match.fycRate);
        const bonus = Math.round(premium * match.bonusRate);

        document.getElementById('fycRate').textContent = (match.fycRate * 100).toFixed(1) + '%';
        document.getElementById('bonusRate').textContent = match.bonusRate > 0 ? (match.bonusRate * 100).toFixed(1) + '%' : '無';
        document.getElementById('fycAmount').textContent = '$' + fyc.toLocaleString();
        document.getElementById('bonusAmount').textContent = '$' + bonus.toLocaleString();
        document.getElementById('totalAmount').textContent = '$' + (fyc + bonus).toLocaleString();
    } else {
        document.getElementById('totalAmount').textContent = '不符投保年齡';
    }
}

function resetResults() {
    document.getElementById('fycRate').textContent = '--';
    document.getElementById('bonusRate').textContent = '--';
    document.getElementById('fycAmount').textContent = '$0';
    document.getElementById('bonusAmount').textContent = '$0';
    document.getElementById('totalAmount').textContent = '$0';
}

init();
</script>

</body>
</html>
