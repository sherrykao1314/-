<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>業務報酬計算機</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #f0f7ff;
            --warning-color: #d9534f;
            --text-color: #333;
            --border-radius: 10px;
        }

        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f2f5f8; color: var(--text-color);
            margin: 0; padding: 10px; 
            display: flex; justify-content: center; align-items: flex-start;
            height: 100vh; overflow: hidden; /* 保持一頁不捲動 */
        }

        .container { 
            width: 100%; max-width: 420px; 
            background: white; border-radius: 20px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* 標題區塊：稍微放寬 */
        .header { background: var(--primary-color); color: white; padding: 15px 10px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        .header p { margin: 3px 0 0; font-size: 13px; opacity: 0.8; }

        /* 警語：單行優化 */
        .disclaimer-box {
            background-color: #fff4f4; border-bottom: 1px solid #ffe8e8;
            padding: 6px 12px; color: var(--warning-color);
            font-size: 11px; font-weight: bold; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .form-content { padding: 15px; }
        .input-group { margin-bottom: 12px; position: relative; }
        label { display: block; margin-bottom: 5px; color: var(--primary-color); font-weight: 600; font-size: 14px; }

        select, input { 
            width: 100%; padding: 10px 12px; 
            border: 1.5px solid #e8edf2; border-radius: var(--border-radius); 
            font-size: 16px; outline: none; box-sizing: border-box;
            background-color: #fff; transition: 0.2s;
        }
        select:focus, input:focus { border-color: var(--primary-color); }

        /* 自定義搜尋結果選單 */
        .search-results {
            position: absolute; top: 100%; left: 0; right: 0;
            background: white; border: 1px solid #ddd; border-radius: 8px;
            max-height: 180px; overflow-y: auto; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: none;
        }
        .search-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #f8f8f8; font-size: 15px; }
        .search-item:last-child { border-bottom: none; }
        .search-item:active { background-color: var(--secondary-color); }

        /* 結果區域 */
        .result-card { 
            background: var(--secondary-color); padding: 15px; 
            border-radius: var(--border-radius); margin-top: 5px; 
            border: 1px solid #ddecff;
        }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 15px; }
        .result-item { font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .result-item span:first-child { color: #666; }
        .result-item span:last-child { font-weight: bold; color: #2c3e50; }

        .total-row { 
            border-top: 1.5px dashed #00336633; padding-top: 10px; 
            margin-top: 10px; font-weight: 800; font-size: 22px; 
            color: var(--primary-color); display: flex; justify-content: space-between; align-items: center;
        }

        .btn-reset { 
            background: #fff; color: #999; border: 1px solid #eee; 
            width: 100%; padding: 10px; border-radius: var(--border-radius); 
            margin-top: 15px; font-weight: bold; cursor: pointer; font-size: 14px;
        }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex; justify-content: center; align-items: center; z-index: 1001;
        }
    </style>
</head>
<body>

<div id="loading" class="loading-overlay">讀取 20251231 資料中...</div>

<div class="container">
    <div class="header">
        <h1>業務報酬計算機</h1>
        <p>資料日期：20251231</p>
    </div>

    <div class="disclaimer-box">
        ⚠️ 本程式非官方製作，僅供輔助計算，正確內容請以公司資料為主。
    </div>

    <div class="form-content">
        <div class="input-group">
            <label>1. 商品名稱 (輸入可搜尋)</label>
            <input type="text" id="productInput" placeholder="請輸入關鍵字..." autocomplete="off" oninput="filterProducts()" onfocus="showAllProducts()">
            <div id="searchResults" class="search-results"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px;">
            <div class="input-group">
                <label>2. 類型</label>
                <select id="typeSelect" onchange="updateTerms()">
                    <option value="">請先選商品</option>
                </select>
            </div>
            <div class="input-group">
                <label>3. 年期</label>
                <select id="termSelect" onchange="calculate()">
                    <option value="">年期</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 12px;">
            <div class="input-group">
                <label>4. 投保年齡</label>
                <input type="number" id="ageInput" placeholder="年齡" oninput="calculate()">
            </div>
            <div class="input-group">
                <label>5. 實收保費</label>
                <input type="number" id="premiumInput" placeholder="輸入金額" oninput="calculate()">
            </div>
        </div>

        <div class="result-card">
            <div class="result-grid">
                <div class="result-item"><span>FYC%</span><span id="fycRate">--</span></div>
                <div class="result-item"><span>獎金%</span><span id="bonusRate">--</span></div>
                <div class="result-item"><span>FYC報</span><span id="fycAmount">$0</span></div>
                <div class="result-item"><span>獎金</span><span id="bonusAmount">$0</span></div>
            </div>
            <div class="total-row">
                <span>總計預估</span>
                <span id="totalAmount">$0</span>
            </div>
        </div>

        <button class="btn-reset" onclick="location.reload()">清除重新輸入</button>
    </div>
</div>

<script>
const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQYzNUsDsKADU8wout-3FhHvknuAWg4AHuWaewLwTKOQj2TcRDSC2chhNEI8nCUQQ_U_MJmszqwY3xH/pub?gid=313101956&single=true&output=csv';
let database = [];
let productList = [];

async function loadData() {
    try {
        const response = await fetch(csvUrl);
        const text = await response.text();
        const rows = text.split(/\r?\n/).slice(1); 
        database = rows.map(row => {
            const cols = row.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            if (cols.length < 6) return null;
            return {
                name: cols[0], type: cols[1], term: cols[2],
                ageMin: parseInt(cols[3]) || 0, ageMax: parseInt(cols[4]) || 99,
                fycRate: parseFloat(cols[5]) || 0,
                bonusRate: (cols[6] === "無" || !cols[6]) ? 0 : parseFloat(cols[6])
            };
        }).filter(item => item && item.name);
        productList = [...new Set(database.map(i => i.name))];
        document.getElementById('loading').style.display = 'none';
    } catch (e) { alert("資料讀取失敗，請檢查連結。"); }
}

function filterProducts() {
    const input = document.getElementById('productInput').value.toUpperCase();
    const filtered = productList.filter(p => p.toUpperCase().includes(input));
    displayResults(filtered);
}
function showAllProducts() { if (document.getElementById('productInput').value === "") displayResults(productList); }
function displayResults(list) {
    const container = document.getElementById('searchResults');
    container.innerHTML = "";
    if (list.length > 0) {
        list.forEach(item => {
            const div = document.createElement('div');
            div.className = 'search-item';
            div.textContent = item;
            div.onclick = () => selectProduct(item);
            container.appendChild(div);
        });
        container.style.display = 'block';
    } else { container.style.display = 'none'; }
}
function selectProduct(name) {
    document.getElementById('productInput').value = name;
    document.getElementById('searchResults').style.display = 'none';
    updateTypes(name);
}
document.addEventListener('click', (e) => { if (!document.getElementById('productInput').contains(e.target)) document.getElementById('searchResults').style.display = 'none'; });

function updateTypes(pName) {
    const types = [...new Set(database.filter(i => i.name === pName).map(i => i.type))];
    const select = document.getElementById('typeSelect');
    select.innerHTML = '<option value="">選擇類型</option>';
    types.forEach(t => select.innerHTML += `<option value="${t}">${t}</option>`);
    calculate();
}
function updateTerms() {
    const pName = document.getElementById('productInput').value;
    const pType = document.getElementById('typeSelect').value;
    const terms = [...new Set(database.filter(i => i.name === pName && i.type === pType).map(i => i.term))];
    const select = document.getElementById('termSelect');
    select.innerHTML = '<option value="">年期</option>';
    terms.forEach(t => select.innerHTML += `<option value="${t}">${t}年</option>`);
    calculate();
}
function calculate() {
    const name = document.getElementById('productInput').value;
    const type = document.getElementById('typeSelect').value;
    const term = document.getElementById('termSelect').value;
    const age = parseInt(document.getElementById('ageInput').value);
    const premium = parseFloat(document.getElementById('premiumInput').value) || 0;
    const match = database.find(i => i.name === name && i.type === type && i.term === term && age >= i.ageMin && age <= i.ageMax);
    if (match) {
        const fyc = Math.round(premium * match.fycRate);
        const bonus = Math.round(premium * match.bonusRate);
        document.getElementById('fycRate').innerText = (match.fycRate * 100).toFixed(1) + '%';
        document.getElementById('bonusRate').innerText = match.bonusRate > 0 ? (match.bonusRate * 100).toFixed(1) + '%' : '無';
        document.getElementById('fycAmount').innerText = '$' + fyc.toLocaleString();
        document.getElementById('bonusAmount').innerText = '$' + bonus.toLocaleString();
        document.getElementById('totalAmount').innerText = '$' + (fyc + bonus).toLocaleString();
    } else {
        document.getElementById('fycRate').innerText = '--';
        document.getElementById('bonusRate').innerText = '--';
        document.getElementById('fycAmount').innerText = '$0';
        document.getElementById('bonusAmount').innerText = '$0';
        document.getElementById('totalAmount').innerText = (name && age) ? '不符年齡' : '$0';
    }
}
loadData();
</script>

</body>
</html>
